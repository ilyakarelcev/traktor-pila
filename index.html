<script>
  (function () {
    // (the same choice as core/i18n.ts: ?lang, else the browser's; the platform may change it later)
    var q = new URLSearchParams(location.search).get('lang');
    var code = (/^(ru|en|tr|de|es)$/.test(q || '') ? q : navigator.language || 'en').toLowerCase();
    var lang = /^(ru|uk|be|kk|uz|ky|tg|hy|az)/.test(code) ? 'ru' : /^tr/.test(code) ? 'tr' : /^de/.test(code) ? 'de' : /^es/.test(code) ? 'es' : 'en';
    var ru = lang === 'ru';
    var TEXT = {
      en: ['Game', 'Loading', 'Waking up the town…', 'Try again', 'Could not load the game. Check your connection and try again.'],
      tr: ['Oyun', 'Yükleniyor', 'Kasaba uyanıyor…', 'Tekrar dene', 'Oyun yüklenemedi. Bağlantını kontrol edip tekrar dene.'],
      de: ['Spiel', 'Wird geladen', 'Die Stadt erwacht…', 'Nochmal versuchen', 'Das Spiel konnte nicht geladen werden. Prüfe die Verbindung und versuche es erneut.'],
      es: ['Juego', 'Cargando', 'El pueblo despierta…', 'Reintentar', 'No se pudo cargar el juego. Revisa la conexión e inténtalo de nuevo.'],
    };
    var text = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = ru ? 'Игра' : text[0];
    if (!ru) {
      document.getElementById('boot-label').textContent = text[1];
      document.getElementById('boot-sub').textContent = text[2];
      document.getElementById('boot-retry').textContent = text[3];
    }
    // Keep a retry action even if the entry module fails to download.
    window.addEventListener('error', function (event) {
      // Vite replaces the entry tag and drops its id in production.
      if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return;
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.dataset.state = 'error'; boot.setAttribute('aria-busy', 'false');
      document.getElementById('boot-sub').textContent = ru ? 'Не удалось загрузить игру. Проверьте соединение и попробуйте снова.' : text[4];
      document.getElementById('boot-retry').hidden = false;
    }, true);
  })();
</script>
